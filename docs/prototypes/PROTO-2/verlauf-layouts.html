<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verlauf auf iPhone und iPad</title>
<!--
  Question: How should Verlauf (the session history) be laid out on iPhone, and what would it become on iPad?
  Plan: Three variants of Verlauf, A/B/C, on iPhone and iPad (iPad portrait and landscape).
        A "Chronik"  - today's day-grouped list, refined. iPhone: push to detail. iPad: tab bar on top,
                       split view (list | detail) in landscape, single column with push in portrait.
        B "Kalender" - not a list: a week strip (iPhone) / month grid (iPad) picks a day, sessions are
                       cards that expand in place. iPad: sidebar navigation instead of a tab bar,
                       landscape adds a detail inspector, portrait keeps the sidebar behind a button.
        C "Feed"     - search-first transcript feed with filter chips and an attention banner; detail
                       is a reading sheet (full sheet on iPhone, centred form sheet on iPad over a
                       2/3-column card grid, top tab bar).
  Moodboard: skipped. The direction is set by DESIGN.md (calm-tech editorial, flat cards, one ink, blue
             only for interactive things) and the History screenshots in docs/screenshots/KA-12.
  Assumptions:
   - Light mode only; dark is the evening default in the app and would use the DESIGN.md dark tokens.
   - Geist is bundled in the app but cannot load in the tab's sandbox; the system font stands in.
   - "Today" is Sunday 1 November 2026. All people, firms and transcripts are invented.
   - Failed segments show "Erneut transkribieren" as in the app's recovery row; buttons are inert stubs.
   - Variant B starts on yesterday (Samstag) so the evening session is visible; the app itself opens
     on the newest entry.
   - The app ships iPhone-only (TARGETED_DEVICE_FAMILY "1"); the iPad half is exploration.
-->
<style>
/* iOS system values (light), overridden with the app's DESIGN.md tokens. */
:root {
  --font: Geist, -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", Inter, Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tint: #1570ef;
  --red: #ec2222; --green: #10a861; --orange: #dc6803;
  --ink: #171717;
  --label: #171717; --label-2: #737373; --label-3: #9e9e9e;
  --sep: #e7e7e7;
  --bg: #f7f7f7; --bg-grouped: #f7f7f7; --cell: #fff; --fill: #f0f0f0;
  --bar: rgba(255,255,255,.92);
  --link10: rgba(21,112,239,.10); --warn10: rgba(220,104,3,.10); --ok10: rgba(16,168,97,.10); --bad10: rgba(236,34,34,.10);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: #d6d9de; font: 17px/1.3 var(--font); color: var(--label); overflow: hidden; }

/* Shell: a device frame scaled to fit the window; full-bleed on a device or in screenshots. */
#stage { position: fixed; inset: 0 0 56px 0; }
#device { position: absolute; left: 50%; top: 50%; overflow: hidden; background: var(--bg);
  border-radius: var(--radius); box-shadow: 0 0 0 10px #1c1c1e, 0 18px 50px rgba(0,0,0,.35); }
body.bleed #stage { inset: 0; }
body.bleed #device { left: 0; top: 0; border-radius: 0; box-shadow: none; }
body.bleed #pill { display: none; }
#screen { position: absolute; inset: 0; overflow: hidden; }

/* Tooling pill: clearly not part of the design. */
#pill { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 4px;
  align-items: center; padding: 4px; border-radius: 999px; background: #222; color: #fff;
  font: 13px/1 ui-monospace, Menlo, monospace; z-index: 10; white-space: nowrap; }
#pill button { font: inherit; color: inherit; background: #3a3a3c; border: 0; border-radius: 999px; padding: 7px 11px; cursor: pointer; }
#pill button[aria-pressed="true"] { background: #0a84ff; }
#pill .label { padding: 0 8px; }

/* Components. Sizes follow the HIG in points (1 CSS px = 1 pt). */
.status { height: 54px; flex: none; }
.ipad .status { height: 24px; }
.nav { position: relative; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
.nav .title { font-weight: 600; }
.nav .left, .nav .right { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 16px; color: var(--tint); }
.nav .left { left: 8px; } .nav .right { right: 16px; }
.large-title { font: 700 34px/41px var(--font); letter-spacing: .37px; padding: 3px 16px 8px; }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-grouped); }
.scroll { flex: 1; overflow-y: auto; }
.section-header { font-size: 13px; text-transform: uppercase; color: var(--label-2); padding: 16px 32px 6px; }
.list { margin: 0 16px; background: var(--cell); border-radius: 10px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; position: relative; }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.cell .sub { font-size: 15px; color: var(--label-2); }
.cell .chev::after { content: "›"; color: var(--label-3); font-size: 22px; margin-left: auto; }
.btn { font: inherit; border: 0; border-radius: 12px; padding: 14px 20px; background: var(--tint); color: #fff; font-weight: 600; }
.btn.plain { background: none; color: var(--tint); padding: 0; font-weight: 400; }
.tabbar { flex: none; display: flex; justify-content: space-around; height: 83px; padding-top: 7px; background: var(--bar); border-top: .5px solid var(--sep); font-size: 10px; color: #999; }
.tabbar .on { color: var(--tint); }
.ipad .tabbar { height: 50px; padding-top: 0; align-items: center; font-size: 13px; }
/* iPad: sidebar + content (+ optional inspector). Portrait keeps only the content column. */
.split { position: absolute; inset: 0; display: grid; grid-template-columns: 320px 1fr; }
.split > .sidebar { background: var(--bg-grouped); border-right: .5px solid var(--sep); position: relative; }
.split > .content { position: relative; }
.portrait .split.collapse { grid-template-columns: 1fr; }
.portrait .split.collapse > .sidebar { display: none; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; transition: opacity .3s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; background: var(--bg-grouped); border-radius: 12px 12px 0 0; transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.9,.3,1); }
.ipad .sheet { left: 50%; right: auto; bottom: 50%; width: 540px; max-height: 620px; border-radius: 12px; transform: translate(-50%, 60%) scale(.96); opacity: 0; transition: transform .3s, opacity .3s; }
.sheet.open { transform: none; } .ipad .sheet.open { transform: translate(-50%, 50%); opacity: 1; }
.sheet-backdrop.open { opacity: 1; }
.push-in { animation: push-in .35s cubic-bezier(.2,.9,.3,1); }
.pop-out { animation: push-in .3s reverse cubic-bezier(.2,.9,.3,1); }
@keyframes push-in { from { transform: translateX(100%); } }

/* ===== Shared building blocks of the app's look (tokens from DESIGN.md) ===== */
svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.f { fill: currentColor; stroke: none; }
button { font-family: inherit; }
.status { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 34px 10px 38px; font: 600 16px/1 var(--font); }
.ipad .status { align-items: center; padding: 0 24px; font-size: 13px; }
.bat { width: 25px; height: 12px; border-radius: 4px; background: var(--ink); position: relative; }
.bat::after { content: ""; position: absolute; right: -3px; top: 4px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: var(--ink); opacity: .5; }
.tnum { font-variant-numeric: tabular-nums; }
.disc { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
.disc.evening { background: var(--link10); color: var(--tint); } .disc.note { background: var(--warn10); color: var(--orange); }
.disc.s20 { width: 20px; height: 20px; font-size: 11px; } .disc.s28 { width: 28px; height: 28px; font-size: 13px; }
.disc.s32 { width: 32px; height: 32px; font-size: 14px; } .disc.s48 { width: 48px; height: 48px; font-size: 22px; }
.pill { display: inline-block; font: 500 12px/1 var(--font); padding: 5px 11px; border-radius: 999px; white-space: nowrap; letter-spacing: .01em; }
.pill.processed { background: var(--ok10); color: var(--green); } .pill.pending { background: var(--warn10); color: var(--orange); }
.pill.failed { background: var(--bad10); color: var(--red); } .pill.transcribing { background: var(--link10); color: var(--tint); }
.pill.dur { background: var(--fill); color: var(--label-2); }
.cap { font: 500 12px/1.375 var(--font); color: var(--label-3); letter-spacing: .01em; }
.up { text-transform: uppercase; letter-spacing: .6px; }
.pp { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--link10); color: var(--tint); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex: none; padding: 0; cursor: pointer; }
.pp .ic-pause { display: none; } .playing .pp .ic-pause { display: inline-flex; } .playing .pp .ic-play { display: none; }
.note-pp .pp { background: var(--warn10); color: var(--orange); }
.scrub { display: none; margin: 10px 0 2px; } .playing .scrub { display: block; }
.scrub .track { height: 4px; border-radius: 2px; background: var(--fill); position: relative; }
.scrub .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--tint); }
.scrub .track i::after { content: ""; position: absolute; right: -8px; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--tint); }
.scrub .tt { display: flex; justify-content: space-between; margin-top: 10px; font: 500 12px/1 var(--font); color: var(--label-3); font-variant-numeric: tabular-nums; }
.dark { background: var(--ink); color: #fff; border-radius: 10px; height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; font-size: 16px; width: 100%; border: 0; }
.sec2 { background: var(--cell); color: var(--ink); border: 1px solid var(--ink); border-radius: 8px; height: 36px; padding: 0 14px; font: 500 15px var(--font); display: inline-flex; align-items: center; gap: 8px; }
.ghost { background: none; border: 0; color: var(--ink); font: 500 15px var(--font); height: 36px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px; }
.mono { font: 400 12px/1.4 var(--mono); color: var(--label-3); letter-spacing: .5px; }
mark { background: rgba(21,112,239,.16); color: inherit; border-radius: 3px; padding: 0 1px; }
/* Floating tab bar of the iPhone app: Abend, Aufnahme, Verlauf, Mehr. */
.ftab { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 68px; border-radius: 34px; background: var(--bar); border: 1px solid var(--sep); display: flex; padding: 5px; z-index: 6; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.ftab > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px/1 var(--font); border-radius: 29px; color: var(--ink); }
.ftab > div.on { background: #e8e8e8; } .ftab svg.i { font-size: 24px; }
/* Top tab bar of iPadOS (used by A and C). */
.ptabs { flex: none; display: flex; justify-content: center; padding: 6px 0 10px; }
.ptabs > div { display: flex; gap: 2px; padding: 4px; border-radius: 22px; background: var(--fill); }
.ptabs span { display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; height: 36px; border-radius: 18px; font: 500 15px var(--font); color: var(--label-2); }
.ptabs span.on { background: var(--cell); color: var(--ink); box-shadow: 0 0 0 1px var(--sep); }
.ptabs svg.i { font-size: 17px; }
.pagetop-ipad { top: 0; }

/* ===== Variant A: Chronik ===== */
.pop-away { animation: pop-away .3s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes pop-away { to { transform: translateX(100%); } }

.v-A .as { font: 500 12px/1.4 var(--font); color: var(--label-3); margin-top: 2px; }
.v-A .atime { font: 500 13px var(--font); color: var(--label-3); font-variant-numeric: tabular-nums; }

.v-A .sh { font: 500 12px/1.4 var(--font); text-transform: uppercase; letter-spacing: .6px; color: var(--label-3); margin: 24px 4px 4px; }
.v-A .seg { padding: 14px 4px; border-bottom: 1px solid var(--sep); }
.v-A .segtop { display: flex; gap: 12px; align-items: flex-start; }
.v-A .segmain { flex: 1; min-width: 0; }
.v-A .segt { font: 500 17px/1.3 var(--font); } .v-A .segm { font: 500 12px/1.4 var(--font); color: var(--label-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.v-A .segx { font: 500 12px/1.4 var(--font); margin-top: 3px; } .v-A .segx.bad { color: var(--red); } .v-A .segx.warn { color: var(--orange); } .v-A .segx.sub { color: var(--label-3); }
.v-A .segtxt { font: 400 16px/1.5 var(--font); color: var(--label-2); margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.v-A .rec { margin-top: 12px; background: var(--cell); border: 1px solid var(--sep); border-radius: 10px; padding: 12px; font: 400 15px/1.4 var(--font); color: var(--label-2); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.v-A .idf { margin: 22px 4px 0; display: flex; flex-direction: column; gap: 4px; }
.v-A .dpad { padding: 0 16px 130px; }
.v-A .agrid { flex: 1; min-height: 0; display: grid; }

.v-A .acol { max-width: 640px; margin: 0 auto; }
.v-A .detail-ttl { font: 700 28px/1.25 var(--font); padding: 8px 0 14px; }

function wirePlay(el) {

  const scale = Math.min(1, (stage.width - 32) / w, (stage.height - 32) / h);
  device.style.setProperty("--radius", d.radius + "px");
  Object.assign(device.style, { width: w + "px", height: h + "px", transform: `translate(-50%, -50%) scale(${scale})` });
}

function render() {
  const v = VARIANTS[state.variant];
  screen.className = `v-${state.variant} ${state.device} ${state.orient}`;
  screen.innerHTML = v.render(state);
  v.wire(screen, state);
  document.querySelector("#pill .label").textContent = `${state.variant} (${v.name})`;
  document.querySelectorAll("[data-device]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.device === state.device));
  layout();
}

// Navigation helpers for flow variants: push a page over the current one, pop it, open a sheet.
function push(container, html) {
  const page = document.createElement("div");
  page.className = "page push-in";
  page.innerHTML = html;
  container.appendChild(page);
  return page;
}
function pop(page) {
  page.classList.replace("push-in", "pop-out");
  page.addEventListener("animationend", () => page.remove(), { once: true });
}
function sheet(container, html) {
  const backdrop = document.createElement("div");
  const panel = document.createElement("div");
  backdrop.className = "sheet-backdrop";
  panel.className = "sheet";
  panel.innerHTML = html;
  container.append(backdrop, panel);
  requestAnimationFrame(() => requestAnimationFrame(() => { backdrop.classList.add("open"); panel.classList.add("open"); }));
  const close = () => { backdrop.remove(); panel.remove(); };
  backdrop.onclick = close;
  return { panel, close };
}

function step(n) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + n + keys.length) % keys.length];
  render();
}
document.getElementById("pill").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.step) step(Number(b.dataset.step));
  if (b.dataset.device) { state.device = b.dataset.device; render(); }
  if (b.hasAttribute("data-orient")) { state.orient = state.orient === "portrait" ? "landscape" : "portrait"; render(); }
});
addEventListener("keydown", (e) => {
  if (e.target.matches && e.target.matches("input")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
addEventListener("resize", layout);
render();

// Screenshot tour for sim-shot.sh (?tour=A,B,C): one Safari tab shows each variant in turn and
// pings the loopback server, which captures the screen while the variant holds.
if (q.has("tour")) {
  const order = q.get("tour").split(",").filter((v) => VARIANTS[v]);
  const show = (i) => {
    if (i >= order.length) return;
    state.variant = order[i];
    render();
    setTimeout(() => fetch(`__shot?${order[i]}`).catch(() => {}).finally(() => setTimeout(() => show(i + 1), 4000)), 800);
  };
  show(0);
}
</script>
</body>
