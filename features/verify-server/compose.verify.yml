# Override for the verify-server skill, layered on server/docker-compose.yml
# (never edited). Always used with `-p vd-verify` and
# `--env-file features/verify-server/verify.env`, so a run:
#   - publishes NO host port (the webapp is reached only by the `driver`
#     service over the project network),
#   - reads verify.env instead of server/.env (no real secret is read),
#   - keeps /data in a project-scoped named volume, not server/data, and
#   - only brings up webapp + postgres + qdrant (no Whisper/Voxtral/GPU).
#
# Needs Compose >= 2.24 for the !override / !reset tags.
services:
  webapp:
    ports: !reset []
    env_file: !override
      - ../features/verify-server/verify.env
    volumes: !override
      - verify_data:/data
      - ./scripts:/app/scripts:ro
    # The base file waits for Whisper; this stack deliberately has none.
    depends_on: !override
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    # Lets `up --wait` block until the app is serving. /health is 200 even when
    # upstreams are down, so this only proves the process is up.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # One-shot HTTP driver on the project network. Not started by `up` (profile);
  # run with `docker compose ... run --rm --no-deps driver python /drive.py <cmd>`.
  # Evidence is its stdout, which the caller redirects into features/evidence/.
  driver:
    profiles: ["drive"]
    image: python:3.11-slim
    env_file:
      - ../features/verify-server/verify.env
    environment:
      BASE_URL: http://webapp:8000
    volumes:
      - ../features/verify-server/drive.py:/drive.py:ro

volumes:
  verify_data:
