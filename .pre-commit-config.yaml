repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        files: ^server/.*\.py$
  # SwiftLint from PATH (`brew install swiftlint`); config and scope live in .swiftlint.yml.
  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --strict
        language: system
        files: ^ios/.*\.swift$
        pass_filenames: false
