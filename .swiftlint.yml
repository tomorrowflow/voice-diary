# SwiftLint policy for hand-written iOS Swift (ios/).
# Lint-only: the hook never runs `swiftlint --fix` or reformats anything.
# Uses the SwiftLint on PATH (`brew install swiftlint`); validated with 0.65.1.
#
# Deliberately conservative: `only_rules` is an explicit allowlist of correctness and
# dead-code rules. SwiftLint's default set and every opt-in rule are OFF, and no
# formatting/style/size rules (trailing_whitespace, line_length, file_length,
# type_body_length, identifier_name, vertical_whitespace, ...) are enabled, so turning this
# on never forces a formatting sweep. Add rules here deliberately, one at a time.
#
# No `disabled_rules` and no per-file disables: baseline findings are tracked for KA-6 to
# fix, not hidden here (see ios/README.md "Linting" for the baseline).

only_rules:
  # Unsafe constructs
  - force_cast                    # `as!`
  - force_try                     # `try!`
  # Likely bugs
  - duplicate_conditions          # same condition twice in an if/else-if chain
  - duplicate_enum_cases
  - duplicate_imports
  - empty_enum_arguments
  - no_fallthrough_only
  - unavailable_condition
  - unused_optional_binding       # `if let _ = x`
  - unused_setter_value
  - unneeded_override
  - private_unit_test             # private XCTest methods never run
  - xctfail_message
  # Dead / noisy code
  - redundant_discardable_let
  - orphaned_doc_comment
  - invalid_swiftlint_command     # typos in `// swiftlint:disable` comments
  - legacy_cggeometry_functions
  - legacy_constructor
  - trailing_semicolon
  - void_return

# Scope: hand-written Swift under ios/ only. Paths are relative to the repo root, where
# the config lives and where the pre-commit hook runs.
included:
  - ios

excluded:
  # Generated by scripts/build_design_system.sh (Style Dictionary), "AUTO-GENERATED. Do not edit".
  - ios/Sources/DesignSystem/DSColor.swift
  - ios/Sources/DesignSystem/DSMetrics.swift
  - ios/Sources/DesignSystem/DSSemantic.swift
  # Vendored Piper bindings, populated by ios/scripts/fetch_piper_voices.sh (gitignored).
  - ios/Sources/TTS/Vendor
  - ios/Frameworks
  # Build output and SwiftPM / Xcode artifacts (gitignored).
  - ios/.build
  - ios/build
  - ios/DerivedData
  - ios/.cache
